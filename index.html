      --ph-orange:       #F26522;
      --ph-navy:         #1B3A5C;
      --ph-soft-bg:      #2a1a10;
      --ph-soft-text:    #f0a070;
      --ph-soft-border:  #5a3020;

      --ph-soft-bg:      #fff3ec;
      --ph-soft-text:    #c4612a;
      --ph-soft-border:  #f5c5a3;
    }

    .ej-root {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
      padding-left: 20px;
      padding-right: 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .ej-container { width: 100%; max-width: 390px; }
    .ej-serif { font-family: 'DM Serif Display', Georgia, serif; }

    .ej-step { animation: stepIn 0.35s ease-out; }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseEmoji {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.95); }
    }
    @keyframes fadeIn {
      from { opacity:0; transform:scale(.6); }
      to   { opacity:1; transform:scale(1); }
    }
    .ej-pulse { animation: pulseEmoji 2s ease-in-out infinite; }

    .ej-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      line-height: 1.6;
      min-height: 80px;
      resize: none;
      transition: border-color .4s ease, background .3s ease;
      -webkit-appearance: none;
    }
    .ej-textarea::placeholder { color: var(--placeholder); }
    .ej-textarea:focus { outline: none; border-color: var(--active-color, var(--ph-orange)); }

    .ej-btn { font-family: inherit; cursor: pointer; -webkit-appearance: none; transition: all 0.3s ease; }
    .ej-btn:disabled { cursor: not-allowed; }
    .ej-main:not(:disabled):active { transform: scale(.98); }

    .theme-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      line-height: 1;

      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

    .hist-card { transition: all 0.3s ease; }
    .hist-card:active { transform: scale(0.99); }

    .ej-grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 88px;
      -webkit-appearance: none;
    }
    .pat-card:active { transform: scale(0.98); }
    .pat-emoji { font-size: 26px; line-height: 1; display: block; transition: transform 0.3s ease; }
    .pat-card.sel .pat-emoji { transform: scale(1.12); }
    .pat-name { font-size: 13px; font-weight: 500; color: var(--text-card); line-height: 1.3; }

    .pti-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .pti-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--divider);
    }
    .pti-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 4px; }
    .pti-desc { font-size: 13px; color: var(--text-verse); line-height: 1.65; }
    .pti-tools { padding: 0 16px 14px; }
    .pti-tool { display: flex; gap: 8px; font-size: 13px; color: var(--text-card); line-height: 1.6; padding: 8px 0; border-top: 1px solid var(--divider); }
    .pti-tool:first-child { border-top: none; padding-top: 12px; }
    .pti-arrow { flex-shrink: 0; margin-top: 3px; font-size: 11px; }

    .pti-tabs { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--divider); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .pti-tab { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; font-size: 12px; font-family: inherit; cursor: pointer; color: var(--text-secondary); transition: all 0.2s; white-space: nowrap; }
    .pti-tab.active { color: #fff; border-color: transparent; }

    /* Tab bar */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
      transition: background 0.3s ease;
    }
    .tab-item {
      flex: 1; padding: 10px 4px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer; font-family: inherit;
      transition: color 0.2s ease;
    }
    .tab-item i { font-size: 20px; }
    .tab-item span { font-size: 10px; }

    /* PTI expandible */
    .pti-pat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .pti-pat-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; cursor: pointer;
    }
    .pti-pat-body {
      padding: 0 16px 14px;
      border-top: 1px solid var(--divider);
    }
  </style>

        weekday: 'short', day: 'numeric', month: 'short',
        hour: '2-digit', minute: '2-digit',
      });

    /* ── Revisión semanal guiada ── */
    function WeeklyReviewModal({ darkMode, onClose }) {
      const getISOWeek = (d) => {
        const date = new Date(d); date.setHours(0,0,0,0);
        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
        const w1 = new Date(date.getFullYear(), 0, 4);
        return 1 + Math.round(((date - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
      };
      const now = new Date();
      const weekKey = `revision_${now.getFullYear()}_W${getISOWeek(now)}`;

      const [loading, setLoading] = React.useState(true);
      const [weekData, setWeekData] = React.useState(null);
      const [answers, setAnswers] = React.useState(['','','','']);
      const [saved, setSaved] = React.useState(false);

      React.useEffect(() => {
        const stored = localStorage.getItem(weekKey);
        if (stored) {
          try { const p = JSON.parse(stored); setAnswers(p.answers || ['','','','']); } catch(e) {}
        }
        loadWeekData();
      }, []);

      const loadWeekData = async () => {
        const sevenAgo = new Date(); sevenAgo.setDate(sevenAgo.getDate() - 7);
        const { data } = await db.from('registros')
          .select('emotion_name, emotion_emoji, intensity, patterns_active')
          .gte('created_at', sevenAgo.toISOString());
        if (!data || data.length === 0) { setWeekData(null); setLoading(false); return; }

        const emotionCount = {};
        data.forEach(r => {
          if (r.emotion_name) {
            const k = `${r.emotion_emoji || ''} ${r.emotion_name}`.trim();
            emotionCount[k] = (emotionCount[k] || 0) + 1;
          }
        });
        const topEmo = Object.entries(emotionCount).sort((a,b) => b[1]-a[1])[0];

        const patCount = {};
        data.forEach(r => (r.patterns_active || []).forEach(p => { patCount[p] = (patCount[p] || 0) + 1; }));
        const topPat = Object.entries(patCount).sort((a,b) => b[1]-a[1])[0];

        const avgIntensity = (data.reduce((s,r) => s + (r.intensity || 0), 0) / data.length).toFixed(1);
        setWeekData({ total: data.length, topEmo, topPat, avgIntensity });
        setLoading(false);
      };

      const updateAnswer = (i, val) => setAnswers(prev => prev.map((a, idx) => idx === i ? val : a));

      const handleSave = async () => {
        localStorage.setItem(weekKey, JSON.stringify({ answers, savedAt: new Date().toISOString() }));
        setSaved(true);
        setTimeout(() => { setSaved(false); }, 1800);
      };

      const handleShare = async () => {
        const sevenAgo = new Date(); sevenAgo.setDate(sevenAgo.getDate() - 7);
        const dateRange = `${sevenAgo.toLocaleDateString('es-ES', { day:'numeric', month:'short' })} – ${now.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' })}`;
        const lines = [
          `🔄 REVISIÓN SEMANAL — Mi Camino`,
          `${dateRange}`,
          weekData ? `${weekData.total} registros · Intensidad media ${weekData.avgIntensity}/10` : '',
          ``,
        ];
        const questions = [
          weekData?.topEmo ? `Emoción principal (${weekData.topEmo[0]}, ${weekData.topEmo[1]}×)` : 'Emoción principal',
          weekData?.topPat ? `Patrón activado (${weekData.topPat[0]}, ${weekData.topPat[1]}×)` : 'Patrón activado',
          `Descripción emocional de la semana`,
          `Lo que me llevo · Lo que quiero trabajar`,
        ];
        questions.forEach((q, i) => {
          if (answers[i].trim()) { lines.push(`${i+1}. ${q}`); lines.push(answers[i].trim()); lines.push(''); }
        });
        lines.push(`— Mi Camino`);
        try { await navigator.share({ title: 'Revisión semanal', text: lines.join('\n') }); } catch(e) {}
      };

      const topPatPattern = weekData?.topPat ? PATTERNS.find(p => p.label === weekData.topPat[0]) : null;

      const questions = [
        {
          label: weekData?.topEmo
            ? `Tu emoción más presente esta semana fue "${weekData.topEmo[0]}" (${weekData.topEmo[1]} ${weekData.topEmo[1]>1?'veces':'vez'})`
            : 'Emoción más presente esta semana',
          placeholder: '¿Qué hay detrás de ella? ¿Te resulta familiar?',
          context: null,
        },
        {
          label: weekData?.topPat
            ? `Activaste el patrón "${weekData.topPat[0]}" ${weekData.topPat[1]} ${weekData.topPat[1]>1?'veces':'vez'}`
            : 'Patrón más activado',
          placeholder: '¿Cómo lo gestionaste? ¿Usaste alguna herramienta del PTI?',
          context: topPatPattern ? topPatPattern.q : null,
        },
        {
          label: weekData
            ? `Tu intensidad media fue ${weekData.avgIntensity}/10`
            : 'Intensidad emocional de la semana',
          placeholder: '¿Cómo describirías la semana emocionalmente?',
          context: null,
        },
        {
          label: '¿Qué te llevas?',
          placeholder: '¿Qué aprendizaje o insight te llevas? ¿Qué quieres trabajar la próxima semana?',
          context: null,
        },
      ];

      const overlayStyle = { position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 1000, display: 'flex', alignItems: 'flex-end', justifyContent: 'center' };
      const sheetStyle = { background: 'var(--card)', borderRadius: '20px 20px 0 0', width: '100%', maxWidth: 500, maxHeight: '92vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 -4px 30px rgba(0,0,0,0.25)' };

      return (
        <div style={overlayStyle} onClick={e => e.target === e.currentTarget && onClose()}>
          <div style={sheetStyle}>
            {/* Header */}
            <div style={{ padding: '18px 20px 14px', borderBottom: '1px solid var(--divider)', flexShrink: 0 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 16, color: 'var(--text)' }}>🔄 Revisión semanal</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
                    {loading ? 'Cargando…' : weekData ? `${weekData.total} registros · Intensidad media ${weekData.avgIntensity}/10` : 'Sin registros esta semana'}
                  </div>
                </div>
                <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 22, color: 'var(--text-muted)', cursor: 'pointer', padding: '0 4px', lineHeight: 1 }}>×</button>
              </div>
            </div>

            {/* Body */}
            <div style={{ overflowY: 'auto', flex: 1, padding: '16px 20px' }}>
              {loading && <div style={{ textAlign: 'center', padding: 32, color: 'var(--text-muted)', fontSize: 13 }}>Cargando datos de la semana…</div>}

              {!loading && !weekData && (
                <div style={{ textAlign: 'center', padding: '32px 0' }}>
                  <div style={{ fontSize: 40, marginBottom: 12 }}>📭</div>
                  <div style={{ fontSize: 14, color: 'var(--text)', fontWeight: 600 }}>Sin registros esta semana</div>
                  <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 6 }}>Haz algún registro para poder hacer la revisión</div>
                </div>
              )}

              {!loading && weekData && questions.map((q, i) => (
                <div key={i} style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ph-orange)', marginBottom: 6, lineHeight: 1.4 }}>{i+1}. {q.label}</div>
                  <textarea
                    value={answers[i]}
                    onChange={e => updateAnswer(i, e.target.value)}
                    placeholder={q.placeholder}
                    rows={3}
                    style={{
                      width: '100%', background: 'var(--input-bg)', border: '1px solid var(--border)',
                      borderRadius: 10, padding: '10px 12px', fontSize: 13, color: 'var(--text)',
                      fontFamily: 'inherit', resize: 'none', outline: 'none', boxSizing: 'border-box',
                      lineHeight: 1.5,
                    }}
                  />
                  {q.context && (
                    <div style={{ fontSize: 11, color: 'var(--ph-soft-text)', background: 'var(--ph-soft-bg)', border: '1px solid var(--ph-soft-border)', borderRadius: 8, padding: '8px 10px', marginTop: 6, fontStyle: 'italic', lineHeight: 1.6 }}>
                      💡 PTI: "{q.context}"
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* Footer */}
            {!loading && weekData && (
              <div style={{ padding: '14px 20px', borderTop: '1px solid var(--divider)', display: 'flex', gap: 10, flexShrink: 0 }}>
                <button onClick={handleSave} style={{
                  flex: 1, padding: '12px 0', background: saved ? '#4CAF50' : 'var(--input-bg)',
                  border: `1px solid ${saved ? '#4CAF50' : 'var(--border)'}`, borderRadius: 12,
                  fontSize: 14, color: saved ? '#fff' : 'var(--text)', cursor: 'pointer', fontFamily: 'inherit', fontWeight: 600,
                  transition: 'all 0.3s',
                }}>{saved ? '✓ Guardado' : '💾 Guardar'}</button>
                <button onClick={handleShare} style={{
                  flex: 2, padding: '12px 0', background: 'var(--ph-orange)', border: 'none',
                  borderRadius: 12, fontSize: 14, fontWeight: 700, color: '#fff',
                  cursor: 'pointer', fontFamily: 'inherit',
                }}>📤 Compartir con terapeuta</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ── Pantalla Home ── */
    function HomeScreen({ setActiveTab, darkMode, setDarkMode, ptiConfig, onRegisterClick }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const [stats, setStats] = useState(null);
      const [loadingStats, setLoadingStats] = useState(true);
      const [weekRecords, setWeekRecords] = useState([]);
      const [showWeeklyReview, setShowWeeklyReview] = useState(false);

      // Los 7 mandamientos — uno por día de la semana
      const MANDAMIENTOS = [
        { dia: 'Lunes',     titulo: 'Sobriedad',    icono: '🧘', texto: 'Cero alcohol, cero drogas, cero tabaco. Cada día que pasa sin ceder es una victoria real.' },
        { dia: 'Martes',    titulo: 'Constancia',   icono: '🔁', texto: 'Hago lo que me propuse. Especialmente cuando no tengo ganas. Sobre todo cuando no tengo ganas.' },
        { dia: 'Miércoles', titulo: 'Integridad',   icono: '⚖️', texto: 'Soy lo que digo que soy. Mi palabra y mis actos van en la misma dirección.' },
        { dia: 'Jueves',    titulo: 'Familia',      icono: '🏠', texto: 'Familia es prioridad real, no solo de palabra. Lo demuestro con lo que hago, no con lo que digo.' },
        { dia: 'Viernes',   titulo: 'Límites',      icono: '🚫', texto: 'Poner límites no es hacerle daño al otro. Es respetarme a mí mismo.' },
        { dia: 'Sábado',    titulo: 'Autocuidado',  icono: '❤️', texto: 'Me pongo primero sin culpa. Cuidarme es cuidar a los que quiero.' },
        { dia: 'Domingo',   titulo: 'Presencia',    icono: '🌿', texto: 'Antes de reaccionar, paro. Elijo desde dónde respondo. No soy mis impulsos.' },
      ];
      // getDay(): 0=domingo,1=lunes...6=sábado → mapeamos a nuestro array (lunes=0)
      const rawDay = new Date().getDay();
      const mandamientoHoy = MANDAMIENTOS[rawDay === 0 ? 6 : rawDay - 1];

      // Check if weekly review already done this week (ISO week, matches WeeklyReviewModal)
      const getWeekKey = () => {
        const d = new Date(); d.setHours(0,0,0,0);
        const tmp = new Date(d); tmp.setDate(tmp.getDate() + 3 - (tmp.getDay() + 6) % 7);
        const w1 = new Date(tmp.getFullYear(), 0, 4);
        const week = 1 + Math.round(((tmp - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
        return `revision_${tmp.getFullYear()}_W${week}`;
      };
      const weeklyReviewDone = !!localStorage.getItem(getWeekKey());

      // ── Hábitos del día ──
      const HABITS_DEF = [
        { id: 'sobriedad',  emoji: '🧘', label: 'Sobriedad' },
        { id: 'ejercicio',  emoji: '🏃', label: 'Ejercicio' },
        { id: 'registro',   emoji: '✏️', label: 'Registro emocional', auto: true },
        { id: 'familia',    emoji: '🏠', label: 'Tiempo en familia' },
        { id: 'aprendizaje',emoji: '🛠️', label: 'Proyectos' },
        { id: 'camion',     emoji: '🚛', label: 'Test camión' },
      ];

      const habitKey = (dateStr) => `habitos_${dateStr}`;
      const todayHabitKey = habitKey(todayStr);

      const [habits, setHabits] = useState(() => {
        try { return JSON.parse(localStorage.getItem(todayHabitKey)) || {}; } catch(e) { return {}; }
      });

      const toggleHabit = (id) => {
        setHabits(prev => {
          const next = { ...prev, [id]: !prev[id] };
          localStorage.setItem(todayHabitKey, JSON.stringify(next));
          return next;
        });
      };

      const getHabitStreak = (id) => {
        let streak = 0;
        const d = new Date();
        for (let i = 0; i < 60; i++) {
          d.setDate(d.getDate() - (i === 0 ? 0 : 1));
          const key = habitKey(d.toISOString().slice(0, 10));
          try {
            const data = JSON.parse(localStorage.getItem(key));
            if (data && data[id]) { streak++; } else { break; }
          } catch(e) { break; }
        }
        return streak;
      };

      useEffect(() => { loadStats(); }, []);

      const loadStats = async () => {
        setLoadingStats(true);
        const thirtyAgo = new Date();
        thirtyAgo.setDate(thirtyAgo.getDate() - 30);
        const sevenAgo = new Date();
        sevenAgo.setDate(sevenAgo.getDate() - 7);

        const { data } = await db.from('registros')
          .select('created_at, patterns_active, emotion_name, emotion_emoji, intensity, values_selected')
          .gte('created_at', thirtyAgo.toISOString())
          .order('created_at', { ascending: false });

        if (data) {
          const weekData = data.filter(r => new Date(r.created_at) >= sevenAgo);

          const emotionCount = {};
          weekData.forEach(r => {
            if (r.emotion_name) {
              const key = r.emotion_name;
              if (!emotionCount[key]) emotionCount[key] = { count: 0, emoji: r.emotion_emoji || '', color: r.emotion_color || 'var(--ph-orange)' };
              emotionCount[key].count++;
            }
          });
          const topEmotions = Object.entries(emotionCount)
            .sort((a, b) => b[1].count - a[1].count).slice(0, 4)
            .map(([name, v]) => ({ name, count: v.count, emoji: v.emoji, color: v.color }));

          const days = new Set(data.map(r => new Date(r.created_at).toLocaleDateString('es-ES')));
          let streak = 0;
          const today = new Date();
          for (let i = 0; i < 30; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            if (days.has(d.toLocaleDateString('es-ES'))) { streak++; } else { break; }
          }

          setWeekRecords(weekData);
          setStats({ weekCount: weekData.length, topEmotions, streak, lastRecord: data[0] || null });

        }
        setLoadingStats(false);
      };

      const [showSessionPreview, setShowSessionPreview] = useState(false);
      const [sessionData, setSessionData] = useState(null);

      const prepareSession = () => {
        const sevenAgo = new Date();
        sevenAgo.setDate(sevenAgo.getDate() - 7);
        const today = new Date();
        const dateRange = `${sevenAgo.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} – ${today.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' })}`;

        const emotionCount = {};
        weekRecords.forEach(r => {
          if (r.emotion_name) {
            const key = r.emotion_name;
            if (!emotionCount[key]) emotionCount[key] = { count: 0, emoji: r.emotion_emoji || '' };
            emotionCount[key].count++;
          }
        });
        const topEmotions = Object.entries(emotionCount).sort((a, b) => b[1].count - a[1].count)
          .map(([name, v]) => ({ name, count: v.count, emoji: v.emoji }));

        const maxRecord = weekRecords.reduce((max, r) => (!max || r.intensity > max.intensity ? r : max), null);

        // Leer revisión semanal si existe
        const getISOWeek = (d) => {
          const date = new Date(d); date.setHours(0,0,0,0);
          date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
          const w1 = new Date(date.getFullYear(), 0, 4);
          return 1 + Math.round(((date - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
        };
        const weekKey = `revision_${today.getFullYear()}_W${getISOWeek(today)}`;
        let revisionAnswers = null;
        try {
          const stored = localStorage.getItem(weekKey);
          if (stored) revisionAnswers = JSON.parse(stored)?.answers || null;
        } catch(e) {}

        setSessionData({ dateRange, topEmotions, maxRecord, revisionAnswers, total: weekRecords.length, ptiConfig });
        setShowSessionPreview(true);
      };

      const shareSession = async () => {
        if (!sessionData) return;
        const { dateRange, topEmotions, maxRecord, revisionAnswers, total } = sessionData;
        const lines = [
          `📋 SESIÓN DE TERAPIA — Mi Camino`,
          dateRange,
          ``,
          `📊 ${total} registro${total !== 1 ? 's' : ''} esta semana`,
          ``,
        ];
        if (topEmotions.length) {
          lines.push(`😤 EMOCIONES`);
          topEmotions.forEach(e => lines.push(`• ${e.emoji} ${e.name} (${e.count}×)`));
          lines.push(``);
        }
        if (maxRecord) {
          const d = new Date(maxRecord.created_at);
          const dateStr = d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
          lines.push(`⭐ MOMENTO MÁS INTENSO`);
          lines.push(`${maxRecord.emotion_emoji || ''} ${maxRecord.emotion_name} · ${maxRecord.intensity}/10 — ${dateStr}`);
          if (maxRecord.feeling_what) lines.push(maxRecord.feeling_what);
          lines.push(``);
        }
        if (revisionAnswers && revisionAnswers.some(a => a.trim())) {
          lines.push(`🔄 REVISIÓN SEMANAL`);
          const qs = ['Emoción principal', 'Patrón activado', 'Cómo describo la semana', 'Lo que me llevo'];
          revisionAnswers.forEach((a, i) => {
            if (a.trim()) { lines.push(`${qs[i]}: ${a.trim()}`); }
          });
          lines.push(``);
        }
        if (sessionData.ptiConfig?.active_patterns?.length > 0) {
          lines.push(``, `🧠 PATRONES QUE TRABAJO`);
          sessionData.ptiConfig.active_patterns.forEach(patId => {
            const p = PATTERNS.find(x => x.id === patId);
            if (!p) return;
            lines.push(`${p.emoji} ${p.label}`);
            const note = sessionData.ptiConfig.pattern_notes?.[patId];
            if (note) lines.push(`   → ${note}`);
          });
          const linkedValues = new Set();
          sessionData.ptiConfig.active_patterns.forEach(patId => {
            const p = PATTERNS.find(x => x.id === patId);
            if (p?.values) p.values.forEach(v => linkedValues.add(v));
          });
          if (linkedValues.size) {
            const vLabels = [...linkedValues].map(vId => ALL_VALUES.find(v => v.id === vId)?.label).filter(Boolean);
            lines.push(`Valores: ${vLabels.join(', ')}`);
          }
        }
        lines.push(``, `— Preparado con Mi Camino`);
        const text = lines.join('\n');
        if (navigator.share) {
          try { await navigator.share({ title: 'Sesión de terapia', text }); } catch(e) {}
        } else {
          try { await navigator.clipboard.writeText(text); alert('Copiado al portapapeles'); } catch(e) {}
        }
      };

      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'Buenos días' : hour < 20 ? 'Buenas tardes' : 'Buenas noches';

      return (

        <div className={`ej-root${darkMode ? '' : ' light'}`}>

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>

                  <span style={{ fontSize: 10, color: 'var(--text-secondary)' }}>· {mandamientoHoy.dia}</span>

                <p style={{ fontSize: 12, color: 'var(--text)', margin: 0, lineHeight: 1.45, fontStyle: 'italic',

            </div>

            {ptiConfig?.active_patterns?.length > 0 && (

              </div>

            {/* ── Hábitos de hoy — grid prominente ── */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', marginBottom: 8, fontWeight: 500 }}>

                        {h.label}

                      {streak > 0 && (

            {/* ── Botón principal ── */}
            <button onClick={onRegisterClick} style={{

              color: 'var(--ph-soft-text)', fontSize: 15, fontWeight: 500,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
              fontFamily: 'inherit', marginBottom: 8, transition: 'all 0.2s',
            }}>
              ✏️ Registrar emoción
            </button>

            {/* ── Botones secundarios side-by-side ── */}
            <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
              {!loadingStats && stats && stats.weekCount > 0 && (
                <button onClick={prepareSession} style={{
                  flex: 1, padding: '10px 8px', borderRadius: 12, cursor: 'pointer',
                  background: 'transparent', border: '1px solid var(--border)',
                  color: 'var(--text-secondary)', fontSize: 12, fontWeight: 500,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5,
                  fontFamily: 'inherit', transition: 'all 0.2s',
                }}>
                  📋 Sesión de terapia
                </button>
              )}
              <button onClick={() => setShowWeeklyReview(true)} style={{
                flex: 1, padding: '10px 8px', borderRadius: 12, cursor: 'pointer',
                background: weeklyReviewDone ? 'transparent' : 'rgba(242,101,34,0.08)',
                border: weeklyReviewDone ? '1px solid var(--border)' : '1px solid rgba(242,101,34,0.3)',
                color: weeklyReviewDone ? 'var(--text-secondary)' : 'var(--ph-orange)',
                fontSize: 12, fontWeight: 500,
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5,
                fontFamily: 'inherit', transition: 'all 0.2s',
              }}>
                {weeklyReviewDone ? '✅' : '🔄'} Revisión semanal
                {!weeklyReviewDone && (
                  <span style={{ fontSize: 9, background: 'var(--ph-orange)', color: 'white', borderRadius: 8, padding: '1px 5px', fontWeight: 700 }}>!</span>
                )}
              </button>
            </div>

            {/* ── Próximos hitos ── */}
            {(() => {
              const inicio = new Date(2025, 7, 28);
              const hoy = new Date(); hoy.setHours(0,0,0,0);
              const diasTotales = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
              const hitos = [
                { dias: 300,  emoji: '🎯', label: '300 días' },
                { dias: 365,  emoji: '🏆', label: '1 año' },
                { dias: 500,  emoji: '💎', label: '500 días' },
                { dias: 730,  emoji: '🌟', label: '2 años' },
              ];
              const proximos = hitos.filter(h => h.dias > diasTotales).slice(0, 2);
              if (!proximos.length) return null;
              return (
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', marginBottom: 8, fontWeight: 500 }}>
                    Próximos hitos
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    {proximos.map(h => {
                      const faltan = h.dias - diasTotales;
                      const fecha = new Date(inicio);
                      fecha.setDate(fecha.getDate() + h.dias);
                      const fechaStr = fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
                      const pct = Math.round((diasTotales / h.dias) * 100);
                      return (
                        <div key={h.dias} style={{
                          flex: 1, background: 'var(--card)', border: '1px solid var(--border)',
                          borderRadius: 12, padding: '12px 14px', overflow: 'hidden', position: 'relative',
                        }}>
                          <div style={{
                            position: 'absolute', bottom: 0, left: 0,
                            width: `${pct}%`, height: 3,
                            background: 'var(--ph-orange)', borderRadius: '0 2px 0 0',
                            transition: 'width 0.4s ease',
                          }} />
                          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                            <span style={{ fontSize: 16 }}>{h.emoji}</span>
                            <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)' }}>{h.label}</span>
                          </div>
                          <div style={{ fontSize: 11, color: 'var(--ph-orange)', fontWeight: 600, marginBottom: 2 }}>
                            {faltan === 1 ? '¡Mañana!' : `en ${faltan} días`}
                          </div>
                          <div style={{ fontSize: 10, color: 'var(--text-secondary)' }}>{fechaStr} · {pct}%</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {/* ── Emociones esta semana — chips ── */}
            {!loadingStats && stats && stats.topEmotions && stats.topEmotions.length > 0 && (
              <div>
                <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', marginBottom: 8, fontWeight: 500 }}>
                  Emociones esta semana
                </div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                  {stats.topEmotions.map(e => (
                    <div key={e.name} style={{
                      background: 'var(--card)', border: '1px solid var(--border)',
                      borderRadius: 20, padding: '5px 11px',
                      display: 'flex', alignItems: 'center', gap: 5,
                    }}>
                      <span style={{ fontSize: 14 }}>{e.emoji}</span>
                      <span style={{ fontSize: 12, color: 'var(--text)' }}>{e.name}</span>
                      <span style={{ fontSize: 11, color: 'var(--text-secondary)' }}>{e.count}×</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>
        </div>

        {showWeeklyReview && (
          <WeeklyReviewModal
            darkMode={darkMode}
            onClose={() => setShowWeeklyReview(false)}
          />
        )}

        {showSessionPreview && sessionData && (
          <div onClick={(e) => { if (e.target === e.currentTarget) setShowSessionPreview(false); }} style={{
            position: 'fixed', inset: 0, zIndex: 1000, background: 'var(--modal-bg)',
            display: 'flex', alignItems: 'flex-end',
          }}>
            <div style={{
              width: '100%', background: 'var(--modal-card)', borderRadius: '20px 20px 0 0',
              padding: '20px 20px calc(28px + env(safe-area-inset-bottom))',

              animation: 'stepIn 0.25s ease-out',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>

                <button onClick={() => setShowSessionPreview(false)} style={{ background: 'none', border: 'none', fontSize: 24, cursor: 'pointer', color: 'var(--text-secondary)', lineHeight: 1 }}>×</button>
              </div>
              <p style={{ fontSize: 12, color: 'var(--text-secondary)', marginBottom: 20 }}>{sessionData.dateRange}</p>

              {/* Registros */}
              <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 12, padding: '10px 14px', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ fontSize: 22 }}>📊</span>
                <span style={{ fontSize: 14, color: 'var(--text)' }}>{sessionData.total} registro{sessionData.total !== 1 ? 's' : ''} esta semana</span>
              </div>

              {sessionData.topEmotions.length > 0 && (
                <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 12, padding: '12px 14px', marginBottom: 12 }}>
                  <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', fontWeight: 600, marginBottom: 10 }}>😤 Emociones</div>
                  {sessionData.topEmotions.map(e => (

                    </div>

              {sessionData.maxRecord && (
                <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 12, padding: '12px 14px', marginBottom: 12 }}>
                  <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', fontWeight: 600, marginBottom: 8 }}>⭐ Momento más intenso</div>

                  {(() => {
                    const linkedValues = new Set();
                    sessionData.ptiConfig.active_patterns.forEach(patId => {
                      const p = PATTERNS.find(x => x.id === patId);
                      if (p?.values) p.values.forEach(v => linkedValues.add(v));
                    });
                    const valueDetails = [...linkedValues].map(vId => ALL_VALUES.find(v => v.id === vId)).filter(Boolean);
                    if (!valueDetails.length) return null;
                    return (
                      <div style={{ paddingTop: 4 }}>
                        <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', marginBottom: 6, fontWeight: 500 }}>Valores en juego</div>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
                          {valueDetails.map(v => (
                            <span key={v.id} style={{ fontSize: 11, background: 'var(--ph-soft-bg)', border: '1px solid var(--ph-soft-border)', color: 'var(--ph-soft-text)', borderRadius: 20, padding: '2px 9px' }}>
                              {v.emoji} {v.label}
                            </span>
                          ))}
                        </div>
                      </div>

              )}

                width: '100%', padding: '14px', borderRadius: 12, marginTop: 4,

                cursor: 'pointer', fontFamily: 'inherit',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
              }}>
                ↗ Compartir con terapeuta
              </button>
            </div>
          </div>
        )}
        </>
      );
    }

    /* ── Tendencias del historial ── */
    function TendenciasView({ darkMode, setDarkMode, onBack }) {
      const [loading, setLoading] = useState(true);
      const [weeklyData, setWeeklyData] = useState([]); // [{label, counts: {patronLabel: n}}]
      const [topPatterns, setTopPatterns] = useState([]);

      useEffect(() => { loadData(); }, []);

      const loadData = async () => {
        const { data } = await db.from('registros')
          .select('created_at, patterns_active')
          .order('created_at', { ascending: false });

        if (!data || data.length === 0) { setLoading(false); return; }

        // Últimas 10 semanas
        const NUM_WEEKS = 10;
        const weeks = [];
        const now = new Date();
        for (let i = NUM_WEEKS - 1; i >= 0; i--) {
          const start = new Date(now);
          start.setDate(start.getDate() - (i + 1) * 7);
          start.setHours(0, 0, 0, 0);
          const end = new Date(now);
          end.setDate(end.getDate() - i * 7);
          end.setHours(23, 59, 59, 999);
          const weekNum = `S-${i === 0 ? 'actual' : i}`;
          weeks.push({ start, end, label: i === 0 ? 'Esta sem.' : i === 1 ? 'Sem. ant.' : `Hace ${i}s`, counts: {} });
        }

        // Contar total por patrón para elegir top 5
        const totalCount = {};
        data.forEach(r => {
          if (r.patterns_active) r.patterns_active.forEach(p => { totalCount[p] = (totalCount[p] || 0) + 1; });
        });
        const top5 = Object.entries(totalCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k]) => k);

        // Distribuir registros por semana
        data.forEach(r => {
          const d = new Date(r.created_at);
          const week = weeks.find(w => d >= w.start && d <= w.end);
          if (week && r.patterns_active) {
            r.patterns_active.forEach(p => {
              if (top5.includes(p)) week.counts[p] = (week.counts[p] || 0) + 1;
            });
          }
        });

        setTopPatterns(top5);
        setWeeklyData(weeks);
        setLoading(false);
      };

      const PATTERN_COLORS = ['#F26522', '#4A9EE0', '#6BAA28', '#8B7FE8', '#E05890'];
      const maxVal = Math.max(1, ...weeklyData.flatMap(w => topPatterns.map(p => w.counts[p] || 0)));

      return (
        <div className={`ej-root${darkMode ? '' : ' light'}`}>
          <div className="ej-container">
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
              <button onClick={onBack} style={{
                background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 10,
                width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: 'pointer', flexShrink: 0,
              }}>
                <i className="ti ti-arrow-left" style={{ fontSize: 18, color: 'var(--text-secondary)' }} />
              </button>
              <h2 style={{ fontSize: 20, fontWeight: 500, color: 'var(--text)', flex: 1 }}>Tendencias</h2>
              <button className="theme-toggle" onClick={() => setDarkMode(d => !d)}>{darkMode ? '☀️' : '🌙'}</button>
            </div>

            <p style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 20, lineHeight: 1.6 }}>
              Evolución de tus patrones en las últimas 10 semanas. ¿Estás gestionando mejor?
            </p>

            {loading && <div style={{ textAlign: 'center', padding: '60px 0', color: 'var(--text-secondary)' }}>Cargando…</div>}

            {!loading && topPatterns.length === 0 && (
              <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 14, padding: 24, textAlign: 'center' }}>
                <div style={{ fontSize: 36, marginBottom: 12 }}>📊</div>
                <p style={{ fontSize: 13, color: 'var(--text-secondary)' }}>Aún no hay datos suficientes.<br/>Haz más registros para ver tendencias.</p>
              </div>
            )}

            {!loading && topPatterns.length > 0 && (
              <>
                {/* Leyenda */}
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 20 }}>
                  {topPatterns.map((p, i) => {
                    const pd = PATTERNS.find(x => x.label === p);
                    return (
                      <div key={p} style={{ display: 'flex', alignItems: 'center', gap: 5, background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 20, padding: '4px 10px' }}>
                        <div style={{ width: 8, height: 8, borderRadius: '50%', background: PATTERN_COLORS[i], flexShrink: 0 }} />
                        <span style={{ fontSize: 11, color: 'var(--text)', fontWeight: 500 }}>{pd?.emoji} {p}</span>
                      </div>
                    );
                  })}
                </div>

                {/* Gráfico de barras por semana */}
                <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 14, padding: '16px 12px', marginBottom: 16 }}>
                  {weeklyData.map((week, wi) => {
                    const hasData = topPatterns.some(p => (week.counts[p] || 0) > 0);
                    return (
                      <div key={wi} style={{ marginBottom: wi < weeklyData.length - 1 ? 14 : 0 }}>
                        <div style={{ fontSize: 10, color: 'var(--text-secondary)', marginBottom: 5, fontWeight: wi === weeklyData.length - 1 ? 600 : 400, color: wi === weeklyData.length - 1 ? 'var(--ph-orange)' : 'var(--text-secondary)' }}>
                          {week.label}
                        </div>
                        {!hasData ? (
                          <div style={{ height: 18, display: 'flex', alignItems: 'center' }}>
                            <span style={{ fontSize: 10, color: 'var(--text-muted)', fontStyle: 'italic' }}>Sin registros</span>
                          </div>
                        ) : (
                          <div style={{ display: 'flex', gap: 3 }}>
                            {topPatterns.map((p, pi) => {
                              const count = week.counts[p] || 0;
                              const width = count > 0 ? Math.max(8, (count / maxVal) * 100) : 0;
                              return (
                                <div key={p} style={{ display: 'flex', alignItems: 'center', gap: 3, flex: count > 0 ? `0 0 ${width}%` : '0 0 6px', minWidth: count > 0 ? 24 : 6, transition: 'flex 0.4s ease' }}>
                                  {count > 0 && (
                                    <div style={{
                                      height: 22, borderRadius: 4, width: '100%',
                                      background: PATTERN_COLORS[pi],
                                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    }}>
                                      <span style={{ fontSize: 10, color: '#fff', fontWeight: 700 }}>{count}</span>
                                    </div>
                                  )}
                                  {count === 0 && (
                                    <div style={{ height: 22, width: 4, borderRadius: 2, background: 'var(--border)' }} />
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* Insight */}
                {(() => {
                  const recent = weeklyData.slice(-3);
                  const older = weeklyData.slice(-8, -3);
                  const recentTotal = recent.reduce((s, w) => s + topPatterns.reduce((ss, p) => ss + (w.counts[p] || 0), 0), 0);
                  const olderTotal = older.reduce((s, w) => s + topPatterns.reduce((ss, p) => ss + (w.counts[p] || 0), 0), 0);
                  const olderAvg = olderTotal / Math.max(older.length, 1);
                  const recentAvg = recentTotal / Math.max(recent.length, 1);
                  const trend = recentAvg < olderAvg * 0.8 ? 'mejor' : recentAvg > olderAvg * 1.2 ? 'más' : 'similar';
                  const msg = trend === 'mejor'
                    ? '📉 Tendencia positiva — estás activando menos patrones que hace semanas.'
                    : trend === 'más'
                    ? '📈 Más activaciones recientes — puede ser un buen momento para revisarlo en terapia.'
                    : '➡️ Ritmo estable — sin cambios significativos en las últimas semanas.';
                  return (
                    <div style={{ background: 'var(--ph-soft-bg)', border: '1px solid var(--ph-soft-border)', borderRadius: 12, padding: '12px 14px' }}>
                      <p style={{ fontSize: 13, color: 'var(--ph-soft-text)', lineHeight: 1.6, margin: 0 }}>{msg}</p>
                    </div>
                  );
                })()}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ── Pantalla Mi PTI ── */
    function PTIScreen({ darkMode, setDarkMode, ptiConfig, refreshPTIConfig }) {
      const [view, setView] = useState('panel'); // 'panel' | 'patrones' | 'emociones' | 'valores' | 'principios' | 'tendencias' | 'editar'
      const [statsData, setStatsData] = useState(null);
      const [loadingStats, setLoadingStats] = useState(true);
      const [expandedPattern, setExpandedPattern] = useState(null);
      const [expandedEmotion, setExpandedEmotion] = useState(null);

      useEffect(() => { loadPTIStats(); }, []);

      const loadPTIStats = async () => {
        setLoadingStats(true);
        const { data } = await db.from('registros')
          .select('created_at, patterns_active, emotion_name, values_selected')
          .order('created_at', { ascending: false });

        if (data) {
          const patternCount = {};
          const valuesCount = {};
          data.forEach(r => {
            if (r.patterns_active && r.patterns_active.length) {
              r.patterns_active.forEach(p => { patternCount[p] = (patternCount[p] || 0) + 1; });
            }
            if (r.values_selected && r.values_selected.length) {
              r.values_selected.forEach(v => { valuesCount[v] = (valuesCount[v] || 0) + 1; });
            }
          });

          const sevenAgo = new Date();
          sevenAgo.setDate(sevenAgo.getDate() - 7);
          const weekData = data.filter(r => new Date(r.created_at) >= sevenAgo);
          const days = new Set(data.map(r => new Date(r.created_at).toLocaleDateString('es-ES')));
          let streak = 0;
          const today = new Date();
          for (let i = 0; i < 60; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            if (days.has(d.toLocaleDateString('es-ES'))) { streak++; } else { break; }
          }

          const emotionCount = {};
          data.forEach(r => {
            if (r.emotion_name) emotionCount[r.emotion_name] = (emotionCount[r.emotion_name] || 0) + 1;
          });

          setStatsData({ total: data.length, weekCount: weekData.length, streak, patternCount, valuesCount, emotionCount });
        }
        setLoadingStats(false);
      };

      /* ── Cabecera reutilizable con botón atrás ── */
      const SubHeader = ({ title, icon }) => (

        <button onClick={onClick} style={{
          width: '100%', background: 'var(--card)', border: '1px solid var(--border)',

          fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 14,
          marginBottom: 10, transition: 'background 0.2s',
        }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10, background: iconBg,
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
          }}>
            <i className={`ti ${icon}`} style={{ fontSize: 20, color: iconColor }} aria-hidden="true" />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>

            <div style={{ fontSize: 12, color: 'var(--text-secondary)', marginTop: 2 }}>{subtitle}</div>
          </div>

            <span style={{
              fontSize: 11, color: 'var(--ph-soft-text)', background: 'var(--ph-soft-bg)',
              padding: '2px 8px', borderRadius: 20, border: '1px solid var(--ph-soft-border)',
              flexShrink: 0,
            }}>{badge}</span>
          )}
          <i className="ti ti-chevron-right" style={{ fontSize: 16, color: 'var(--text-secondary)', flexShrink: 0 }} aria-hidden="true" />
        </button>

        const weekPatterns = statsData ? Object.entries(statsData.patternCount) : [];
