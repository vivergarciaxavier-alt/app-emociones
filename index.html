    .ej-root {

      color: var(--text);

      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
      padding-left: 20px;
      padding-right: 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .ej-container { width: 100%; max-width: 390px; }
    .ej-serif { font-family: 'DM Serif Display', Georgia, serif; }

    .ej-step { animation: stepIn 0.35s ease-out; }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseEmoji {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.95); }
    }
    @keyframes fadeIn {
      from { opacity:0; transform:scale(.6); }
      to   { opacity:1; transform:scale(1); }
    }
    .ej-pulse { animation: pulseEmoji 2s ease-in-out infinite; }
    .ej-check { animation: fadeIn .15s ease-out; display: inline-block; }

    .ej-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      line-height: 1.6;
      min-height: 80px;
      resize: none;
      transition: border-color .4s ease, background .3s ease;
      -webkit-appearance: none;
    }
    .ej-textarea::placeholder { color: var(--placeholder); }
    .ej-textarea:focus { outline: none; border-color: var(--active-color, var(--ph-orange)); }

    .ej-btn { font-family: inherit; cursor: pointer; -webkit-appearance: none; transition: all 0.3s ease; }
    .ej-btn:disabled { cursor: not-allowed; }
    .ej-main:not(:disabled):active { transform: scale(.98); }

      border-radius: 20px;
      padding: 5px 10px;

                            const anchorLabel = anchorValue ? ALL_VALUES.find(v => v.id === anchorValue)?.label : null;
                            const patternsLabel = selectedPatterns.map(p => p.label).join(', ');
                            try {
                              await navigator.share({
                                title: 'Hoja de sentimiento',
                                text: `${emotion.emoji} ${emotion.name} Â· ${intensity}/10\n${patternsLabel ? `PatrÃ³n: ${patternsLabel}\n` : ''}${anchorLabel ? `Ancla: ${anchorLabel}\n` : ''}\nÂ¿QuÃ© pasÃ³?\n${feelings.what}\n\nÂ¿QuÃ© generÃ³?\n${feelings.generated}\n\nÂ¿CÃ³mo lo gestionÃ©?\n${feelings.managed}\n\n${verse.referencia}\n"${verse.versiculo}"`,
                              });
                            } catch(e) {}
                          }} style={{ width: '100%', marginTop: 10, padding: '13px 0', background: 'transparent', border: `1px solid ${activeColor}50`, borderRadius: 14, color: activeColor, fontSize: 14, fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                            <span>â</span> Compartir hoja
                          </button>
                        )}
                      </>
                    )}
                  </>
                )}
              </div>

              <div style={{ marginTop: 28, display: 'flex', gap: 10 }}>
                {step > 1 && step < 6 && (
                  <button className="ej-btn" onClick={handleBack} style={{ padding: '15px 20px', background: 'transparent', border: '1px solid var(--border)', borderRadius: 14, color: 'var(--text-secondary)', fontSize: 15, fontWeight: 500 }}>
                    AtrÃ¡s
                  </button>
                )}
                {step < 6 && (
                  <button className="ej-btn ej-main" disabled={!canContinue()} onClick={handleNext} style={{ flex: 1, padding: 15, borderRadius: 14, fontSize: 15, fontWeight: 600, background: canContinue() ? activeColor : 'var(--btn-off-bg)', color: canContinue() ? '#fff' : 'var(--btn-off-text)', border: 'none' }}>
                    {step === 4 && selectedPatterns.length === 0 ? 'Continuar sin patrÃ³n' : step === 5 ? 'ð Recibir versÃ­culo' : 'Continuar'}
                  </button>
                )}
                {step === 6 && !loading && verse && (
                  <button className="ej-btn" onClick={reset} style={{ flex: 1, padding: 15, background: 'transparent', border: '1px solid var(--border)', borderRadius: 14, color: 'var(--text-secondary)', fontSize: 15, fontWeight: 500 }}>
                    Nuevo registro
                  </button>
                )}
              </div>

            </div>
          </div>
          <TabBar activeTab={activeTab} setActiveTab={setActiveTab} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
